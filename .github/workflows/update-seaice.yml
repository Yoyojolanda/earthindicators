name: Update sea ice data

on:
  schedule:
    - cron: "45 14 * * *"      # daily, 14:45 UTC (15 min after the Niño job)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NSIDC Sea Ice Index daily extent
        run: |
          mkdir -p data
          for h in N:north S:south; do
            f="${h%%:*}_seaice_extent_daily_v4.0.csv"
            # download to a temp file first, so a failed download never replaces good data
            curl -fsSL --retry 3 --retry-delay 20 -o "data/$f.tmp" \
              "https://noaadata.apps.nsidc.org/NOAA/G02135/${h#*:}/daily/data/$f"
            mv "data/$f.tmp" "data/$f"
          done
          head -3 data/N_seaice_extent_daily_v4.0.csv
          tail -1 data/N_seaice_extent_daily_v4.0.csv
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update sea ice data" && git pull --rebase && git push)
