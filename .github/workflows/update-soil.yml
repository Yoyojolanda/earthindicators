name: Update soil moisture and flash droughts (ERA5)

# Root-zone soil moisture from Google's ARCO-ERA5 copy (no account, no queue), counted in five-day periods, so a
# weekly run is enough. The first run reads 1950 to now once (about an hour); later runs read only the last 100 days.
on:
  schedule:
    - cron: "41 7 * * 3"       # Wednesdays
  workflow_dispatch:           # lets you run it manually from the Actions tab
    inputs:
      rebuild:
        description: "Recalculate everything since 1950 (normals, percentiles, all years)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: soil
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy xarray zarr gcsfs dask
      # every pentad since 1950 at every land point (~400 MB), kept in GitHub's Actions cache rather than the repository,
      # so a rebuild with other settings does not have to read 75 years from ARCO-ERA5 again
      - uses: actions/cache/restore@v4
        with:
          path: ~/soilcache
          key: soil-pentads-v1-${{ github.run_id }}
          restore-keys: soil-pentads-v1-
      - name: Build soil moisture and flash droughts
        env:
          SOIL_REBUILD: ${{ inputs.rebuild && '1' || '' }}
          SOIL_CACHE: /home/runner/soilcache/pentads.npz
        run: |
          mkdir -p ~/soilcache
          python -u scripts/build_soil.py
      - uses: actions/cache/save@v4
        with:
          path: ~/soilcache
          key: soil-pentads-v1-${{ github.run_id }}
      - name: Commit changes
        if: always()
        run: |
          rm -f data/*.tmp data/*.tmp.npz
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/soil_*
          git diff --cached --quiet || (git commit -m "Update soil moisture data" && git pull --rebase && git push)
