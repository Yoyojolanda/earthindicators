name: Probe permafrost sources (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4
      - name: Run
        run: python -u scripts/build_permafrost.py > probe.txt 2>&1 || true
      - name: Save
        if: always()
        run: |
          mkdir out && cp probe.txt out/ && cp data/permafrost_* data/slow_status.json out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b probe-out
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm probe && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
