name: Probe permafrost sources (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4 h5netcdf
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import re, io, json, urllib.request, urllib.parse
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          def get(u, t=300, h=None):
              r = urllib.request.Request(u, headers=h or {"User-Agent": UA, "Accept": "text/html,*/*"})
              return urllib.request.urlopen(r, timeout=t).read()
          def sec(n): print("\n========", n, flush=True)
          E = "https://data.permafrostnet.ca/erddap/tabledap/pn_erddap_all_ground_temperature"
          for u in [E + ".das",
                    E + ".csv?platform_id,latitude,longitude,time&orderByMinMax(%22platform_id,time%22)",
                    ]:
              try:
                  sec(u); t = get(u, 600).decode(); print(len(t)); print(t[:12000])
              except Exception as e: print("ERR", e)
          for u in ["https://www.epa.gov/climate-indicators/climate-change-indicators-permafrost",
                    "https://www.epa.gov/climate-indicators/permafrost"]:
              try:
                  sec(u); h = get(u, h={"User-Agent": "curl/8.5.0", "Accept": "*/*"}).decode()
                  for l in sorted(set(re.findall(r'href="([^"]+)"', h))):
                      if re.search(r"(?i)csv|xls|zip|permafrost", l): print("  ", l)
              except Exception as e: print("ERR", e)
          try:
              sec("arcticdata solr")
              q = "https://arcticdata.io/metacat/d1/mn/v2/query/solr/?q=" + urllib.parse.quote('title:*permafrost* AND title:*temperature* AND (title:*Alaska* OR title:*borehole*)') + "&fl=identifier,title,beginDate,endDate,dateUploaded&rows=60&sort=dateUploaded+desc&wt=json"
              d = json.loads(get(q, h={"User-Agent": UA}))
              for x in d["response"]["docs"]: print(x.get("dateUploaded","")[:10], x.get("beginDate","")[:4], x.get("endDate","")[:4], x["identifier"], "|", x["title"][:160])
          except Exception as e: print("ERR", e)
          PY
          python -u probe.py > probe.txt 2>&1 || true
      - name: Save
        if: always()
        run: |
          df -h . | tail -1 >> probe.txt; free -m >> probe.txt
          git init -q out && cd out && cp ../probe.txt . && git checkout -q -b probe-out
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add probe.txt && git commit -qm probe && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
