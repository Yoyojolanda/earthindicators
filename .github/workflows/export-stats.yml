name: Export visitor statistics

on:
  schedule:
    - cron: "0 6 * * *"        # daily, 06:00 UTC
  workflow_dispatch:           # lets you run it manually from the Actions tab
  push:                        # and once right away whenever this workflow file itself is changed and pushed
    paths:
      - ".github/workflows/export-stats.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Export new page views from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/export_goatcounter.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || (git commit -m "Export visitor statistics" && git pull --rebase && git push)
