name: Update temperature records (NASA, NOAA, HadCRUT, Berkeley Earth)

# Four independent monthly records of world temperature, for the "five records" chart on the air page (the fifth,
# ERA5, has its own job). Each publishes a new month somewhere around the 8th to 20th of the next month, so twice a week
# is enough; each run downloads one small file per record (well under 1 MB in all). scripts/build_temp_records.py
# keeps a record's previous values if its download or checks fail.
on:
  schedule:
    - cron: "23 7 * * 1,4"     # Mondays and Thursdays, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and check
        run: python -u scripts/build_temp_records.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/temp_records_monthly.csv data/temp_records_source.txt
          git diff --cached --quiet || (git commit -m "Update temperature records" && git pull --rebase && git push)
