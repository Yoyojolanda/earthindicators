name: Update land water storage and SMAP soil moisture (NASA)

# GRACE/GRACE-FO land water storage (one ~45 MB file, downloaded only when NASA publishes a newer one, about monthly)
# and SMAP Level-4 root-zone soil moisture (one small strided OPeNDAP request a day; the first run reads every day
# since 2015). Both need the Earthdata login.
on:
  schedule:
    - cron: "23 8 * * 4"       # Thursdays
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: water-nasa
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4 requests
      - name: Earthdata login
        env:
          EDL_USER: ${{ secrets.EARTHDATA_USERNAME }}
          EDL_PASS: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          printf 'machine urs.earthdata.nasa.gov login %s password %s\n' "$EDL_USER" "$EDL_PASS" > ~/.netrc
          chmod 600 ~/.netrc
          printf 'HTTP.NETRC=%s/.netrc\nHTTP.COOKIEJAR=%s/.edl_cookies\n' "$HOME" "$HOME" > ~/.dodsrc
      - name: GRACE/GRACE-FO land water storage
        continue-on-error: true
        run: |
          set -o pipefail
          rc=0; python -u scripts/build_grace_tws.py 2>&1 | tee /tmp/g.log || rc=$?; tail -30 /tmp/g.log > data/grace_tws_check.txt; exit $rc
      - name: SMAP root-zone soil moisture
        continue-on-error: true
        timeout-minutes: 200
        run: |
          set -o pipefail
          rc=0; python -u scripts/build_smap.py 2>&1 | tee /tmp/s.log || rc=$?; tail -30 /tmp/s.log > data/smap_check.txt; exit $rc
      - name: Commit changes
        if: always()
        run: |
          rm -f ~/.netrc ~/.dodsrc ~/.edl_cookies data/*.tmp
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update land water storage and SMAP data" && git pull --rebase && git push)
