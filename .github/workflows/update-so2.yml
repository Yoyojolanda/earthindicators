name: Update sulfur dioxide emissions (CEDS)

# For the "Cleaner air" section of eei.html. CEDS publishes a new version about once a year; the archive is ~60 MB
# and Zenodo serves it slowly, so this first checks the version and only downloads when there is a new one.
on:
  schedule:
    - cron: "20 16 3 * *"      # monthly, on the 3rd
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Download and extract only when CEDS has a new version
        run: |
          set -- $(python3 scripts/build_so2.py check)
          if [ -z "$1" ]; then echo "CEDS unchanged"; exit 0; fi
          echo "New CEDS version $2, downloading"
          curl -fsSL --retry 3 --retry-delay 60 -o "$RUNNER_TEMP/ceds.zip" "$1"
          python3 scripts/build_so2.py build "$RUNNER_TEMP/ceds.zip" "$2"
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update sulfur dioxide emissions (CEDS)" && git pull --rebase && git push)
