name: Probe NASA Earthdata sources (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4 requests
      - name: Probe
        env:
          EDL_USER: ${{ secrets.EARTHDATA_USERNAME }}
          EDL_PASS: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          printf 'machine urs.earthdata.nasa.gov login %s password %s\n' "$EDL_USER" "$EDL_PASS" > ~/.netrc; chmod 600 ~/.netrc
          echo "HTTP.NETRC=$HOME/.netrc" > ~/.dodsrc; echo "HTTP.COOKIEJAR=$HOME/.cookies" >> ~/.dodsrc
          cat > p.py <<'PY'
          import json, time, requests, re
          S = requests.Session()
          def cmr(q):
              return requests.get("https://cmr.earthdata.nasa.gov/search/" + q, timeout=60).json()
          for short in ["TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4", "SPL4SMGP", "GPM_3IMERGDF", "GPM_3IMERGDL"]:
              print("\n========", short, flush=True)
              try:
                  c = cmr(f"collections.json?short_name={short}")["feed"]["entry"]
                  for e in c[:3]: print(" coll", e["id"], e.get("version_id"), e.get("time_start"), e.get("time_end"))
                  g = cmr(f"granules.json?short_name={short}&sort_key=-start_date&page_size=2")["feed"]["entry"]
                  for e in g:
                      print(" gran", e["title"], e.get("time_start"), e.get("granule_size"))
                      for l in e.get("links", []):
                          h = l.get("href", "")
                          if h.startswith("http") and ("opendap" in h or h.endswith((".nc", ".h5", ".nc4"))): print("   ", h)
              except Exception as ex: print("ERR", ex)
          # OPeNDAP tests (DAP2 style on opendap.earthdata.nasa.gov)
          import netCDF4
          def tryo(url, var):
              t = time.time()
              try:
                  ds = netCDF4.Dataset(url); print("  opened", url[:140], list(ds.variables)[:12], f"{time.time()-t:.1f}s"); return ds
              except Exception as ex: print("  open ERR", url[:140], ex); return None
          for short in ["SPL4SMGP", "GPM_3IMERGDF"]:
              g = cmr(f"granules.json?short_name={short}&sort_key=-start_date&page_size=1")["feed"]["entry"][0]
              ops = [l["href"] for l in g["links"] if "opendap" in l.get("href", "")]
              print(short, ops)
              for o in ops[:1]:
                  ds = tryo(o, None)
                  if ds is not None:
                      try:
                          if short == "SPL4SMGP":
                              v = ds.variables.get("Geophysical_Data_sm_rootzone") or ds.variables[[k for k in ds.variables if "rootzone" in k][0]]
                              t = time.time(); a = v[..., ::20, ::20]; print("  rootzone strided", a.shape, float(a.min()), float(a.max()), f"{time.time()-t:.1f}s")
                          else:
                              v = ds.variables["precipitation"]; print("  dims", v.dimensions, v.shape)
                              t = time.time(); a = v[0, ::5, ::5]; print("  precip strided", a.shape, float(a.max()), f"{time.time()-t:.1f}s")
                              t = time.time(); a = v[0, :, :]; print("  precip full", a.shape, float(a.max()), f"{time.time()-t:.1f}s")
                      except Exception as ex: print("  read ERR", ex)
          PY
          python -u p.py > probe.txt 2>&1 || true
          rm -f ~/.netrc
      - name: Save
        if: always()
        run: |
          mkdir out && cp probe.txt out/ && cd out && git init -q && git checkout -q -b probe-out
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm probe && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
