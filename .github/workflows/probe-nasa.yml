name: Probe IMERG access (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy netCDF4 requests
      - name: Probe
        env:
          EDL_USER: ${{ secrets.EARTHDATA_USERNAME }}
          EDL_PASS: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          printf 'machine urs.earthdata.nasa.gov login %s password %s\n' "$EDL_USER" "$EDL_PASS" > ~/.netrc; chmod 600 ~/.netrc
          printf 'HTTP.NETRC=%s/.netrc\nHTTP.COOKIEJAR=%s/.c\n' "$HOME" "$HOME" > ~/.dodsrc
          cat > p.py <<'PY'
          import time, requests, netCDF4, numpy as np, io
          S = requests.Session()
          for short, day in [("GPM_3IMERGDF", "2025-09-30"), ("GPM_3IMERGDL", "2026-10-20")]:
              g = requests.get(f"https://cmr.earthdata.nasa.gov/search/granules.json?short_name={short}&temporal={day}T00:00:00Z,{day}T23:59:59Z", timeout=60).json()["feed"]["entry"][0]
              op = [l["href"] for l in g["links"] if "opendap" in l.get("href", "")][0]
              for ce in ["/precipitation[0][0:10:3599][0:10:1799]", "/precipitation[0:1:0][0:10:3599][0:10:1799]"]:
                  u = op + ".dap.nc4?dap4.ce=" + requests.utils.quote(ce, safe="/[]:")
                  t = time.time(); r = S.get(u, timeout=120)
                  print(short, ce, r.status_code, len(r.content), r.headers.get("content-type"), f"{time.time()-t:.1f}s")
                  if r.status_code == 200:
                      open("x.nc", "wb").write(r.content); ds = netCDF4.Dataset("x.nc")
                      print("  vars", list(ds.variables), {k: ds.variables[k].shape for k in ds.variables})
                      v = ds.variables["precipitation"][:]; print("  max", float(v.max()), "mean", float(v.mean()), ds.variables["precipitation"].dimensions)
                      break
                  else: print(r.text[:300])
          PY
          python -u p.py > probe.txt 2>&1 || true
          rm -f ~/.netrc
      - name: Save
        if: always()
        run: |
          mkdir out && cp probe.txt out/ && cd out && git init -q && git checkout -q -b probe-out
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm probe && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
