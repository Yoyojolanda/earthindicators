name: Probe aerosol data sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
          curl -fsSL "https://zenodo.org/api/records/15059443/files/CEDS_v_2025_03_18_aggregate.zip/content" -o a.zip
          unzip -l a.zip | grep -i so2
          f=$(unzip -Z1 a.zip | grep -i 'SO2' | grep -i 'global.*sector' | grep -iv fuel | head -1); echo "SECTORFILE $f"
          unzip -p a.zip "$f" | head -2 | cut -c1-300
          unzip -p a.zip "$f" | cut -d, -f1-4 | sort -u | head -30
          g=$(unzip -Z1 a.zip | grep -i 'SO2' | grep -i 'country' | grep -iv 'sector\|fuel' | head -1); echo "COUNTRYFILE $g"
          unzip -p a.zip "$g" | head -3 | cut -c1-200
          } > out.txt 2>&1
          echo "::notice title=probe::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' out.txt)"
