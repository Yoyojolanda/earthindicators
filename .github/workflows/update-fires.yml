name: Update wildfire emissions (GWIS)

# Weekly fire CO2 emissions per region from the Global Wildfire Information System's statistics API. GWIS publishes a
# new week once a week, at no fixed day, so this checks twice a week; each run fetches only the current year
# (~15 small requests). The very first run downloads every year since 2003. scripts/build_fires.py keeps the previous
# values for any region or year that fails.
on:
  schedule:
    - cron: "37 8 * * 2,5"     # Tuesdays and Fridays, 08:37 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and check
        run: python -u scripts/build_fires.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/fires_weekly.csv data/fires_status.json
          git diff --cached --quiet || (git commit -m "Update wildfire emissions" && git pull --rebase && git push)
