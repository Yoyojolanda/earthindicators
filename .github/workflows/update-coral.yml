name: Update coral reef heat stress (NOAA Coral Reef Watch)

# Bleaching alert levels for ~220 coral reef regions (NOAA Coral Reef Watch Regional Virtual Stations), daily. The
# first run downloads each station's full history once (~1.3 MB per station); later runs read only the last ~100 days
# of each file (a few kB), so a daily run is about 2 MB in all. See scripts/build_coral.py.
on:
  schedule:
    - cron: "17 16 * * *"      # daily, 16:17 UTC (CRW posts the previous day's data in the morning, US time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coral
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and check
        run: python -u scripts/build_coral.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/coral_baa.csv data/coral_alert_daily.csv data/coral_status.json
          git diff --cached --quiet || (git commit -m "Update coral reef heat stress" && git pull --rebase && git push)
