name: Update CO2 data

on:
  schedule:
    - cron: "0 15 * * *"       # daily, 15:00 UTC
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NOAA GML Mauna Loa daily CO2
        run: |
          mkdir -p data
          # download to a temp file first, so a failed download never replaces good data
          curl -fsSL --retry 3 --retry-delay 20 -o data/co2_daily_mlo.txt.tmp \
            https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_daily_mlo.txt
          # sanity check: must contain at least 10,000 data lines
          [ "$(grep -vc '^#' data/co2_daily_mlo.txt.tmp)" -gt 10000 ]
          mv data/co2_daily_mlo.txt.tmp data/co2_daily_mlo.txt
          tail -2 data/co2_daily_mlo.txt
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update CO2 data" && git pull --rebase && git push)
