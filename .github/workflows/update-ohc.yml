name: Update ocean heat content data

on:
  schedule:
    - cron: "0 15 * * 1"       # weekly, Mondays 15:00 UTC (NOAA updates quarterly)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download NOAA NCEI ocean heat content, world (w0), Atlantic incl. Arctic (a0), Pacific (p0) and Indian (i0), (0-2000 m from 2005, 0-700 m from 1955)
        run: |
          mkdir -p data
          base=https://www.ncei.noaa.gov/data/oceans/woa/DATA_ANALYSIS/3M_HEAT_CONTENT/DATA/basin
          for b in w0 a0 p0 i0; do for p in yearly/h22-$b-2000m.dat yearly/h22-$b-700m.dat 3month/h22-$b-2000m1-3.dat 3month/h22-$b-2000m4-6.dat 3month/h22-$b-2000m7-9.dat 3month/h22-$b-2000m10-12.dat; do
            f=$(basename "$p")
            # download to a temp file first, so a failed download never replaces good data
            curl -fsSL --retry 3 --retry-delay 20 -o "data/$f.tmp" "$base/$p"
            n=$(wc -l < "data/$f.tmp")
            echo "$f: $n lines, last: $(tail -1 "data/$f.tmp")"
            [ "$n" -gt 15 ] || { echo "too few lines in $f"; exit 1; }
            mv "data/$f.tmp" "data/$f"
          done; done
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update ocean heat content data" && git pull --rebase && git push)
