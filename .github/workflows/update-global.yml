name: Update global sea-surface temperature data

on:
  schedule:
    - cron: "13 9,21 * * *"    # twice a day, odd minutes (see update-nino34.yml)
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4 pydap

      # Global sea-surface temperature: NOAA OISST v2.1, 60S-60N, every 4th grid point (1 degree)
      - name: Build global SST (NOAA OISST)
        continue-on-error: true
        timeout-minutes: 320
        run: |
          echo "HTTP.TIMEOUT=120" > ~/.dodsrc
          python -u scripts/build_nino34.py --lat -60 60 --lon 0 360 --stride 4 \
            --out data/oisst2.1_world_sst_day.json --cache data/world_daily_sst.csv

      - name: Commit changes
        if: always()
        run: |
          rm -f data/*.tmp
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update global SST data" && git pull --rebase && git push)
