name: Update link-preview images

on:
  schedule:
    - cron: "30 19 * * 1"      # weekly, Monday 19:30 UTC, after the daily data updates
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install matplotlib

      - name: Collect live numbers (same code as the site)
        run: node scripts/og_data.js

      - name: Draw the images
        run: python scripts/build_og.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add og
          git diff --cached --quiet || (git commit -m "Update link-preview images" && git pull --rebase && git push)
