name: Probe coral data sources (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe
        run: |
          cat > p.py <<'PY'
          import re, json, csv, io, urllib.request, collections
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) Chrome/126 earthindicators.org"}
          def get(u, t=300): return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t).read()
          print("======== AIMS")
          t = get("https://apps.aims.gov.au/reef-monitoring/main-4WRA6BLJ.js").decode("utf-8","replace")
          for i in [m.start() for m in re.finditer("BASE_API:", t)][:3]: print(t[max(0,i-100):i+300])
          m = re.search(r'BASE_API:\s*["`\']([^"`\']+)', t); base = m.group(1) if m else None; print("base", base)
          for path in ["region-list", "sector-list", "sector-summary?sector=CA&year=2025", "region-summary", "gbr-summary", "summary"]:
              try:
                  u = base + path; b = get(u).decode("utf-8","replace"); print("--", u, len(b)); print(b[:1500])
              except Exception as e: print("--", path, "ERR", e)
          print("======== GCBD")
          raw = get("https://datadocs.bco-dmo.org/dataset/773466/file/B11vA82u7y2Owp/global_bleaching_environmental.csv", 600).decode("utf-8","replace")
          rd = list(csv.DictReader(io.StringIO(raw))); print(list(rd[0].keys()))
          print("Percent_Bleached", collections.Counter(r["Percent_Bleached"] for r in rd).most_common(12))
          y = collections.defaultdict(list); src = collections.defaultdict(collections.Counter)
          for r in rd:
              try: y[int(r["Date_Year"])].append(float(r["Percent_Bleached"])); src[int(r["Date_Year"])][r["Data_Source"]] += 1
              except: pass
          for k in sorted(y):
              v = y[k]; print(k, len(v), round(sum(1 for x in v if x > 0)/len(v)*100, 1), round(sum(1 for x in v if x >= 30)/len(v)*100, 1), round(sum(v)/len(v), 1), dict(src[k].most_common(3)))
          PY
          python -u p.py > probe.txt 2>&1 || true
      - name: Save
        if: always()
        run: |
          mkdir out && cp probe.txt out/ && cd out && git init -q && git checkout -q -b probe-out
          git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm probe && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
