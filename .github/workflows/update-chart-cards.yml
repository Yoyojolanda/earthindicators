name: Update chart share links

# One share link per chart (s/<page>-<chart>.html) with the chart itself as link preview (og/s/...jpg).
# The charts are drawn by the real pages in a headless browser, so the previews show the latest data.
on:
  schedule:
    - cron: "51 22 * * 1"      # weekly, Monday evening after the day's data updates: a preview only has to look
                               # about right (the link always opens the live chart), and each redraw adds every
                               # changed image to the repository's history for good
  workflow_dispatch:           # lets you run it manually from the Actions tab
    inputs:
      pages:
        description: "Only these pages, comma-separated (e.g. ch4.html,co2.html). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: chart-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installing the headless browser is the heavy part (~150 MB), so first check whether anything the charts
      # are drawn from (data, pages, scripts, styles, fonts) changed since the last drawing. The fingerprint
      # leaves out the outputs (s/, og/) and the visitor statistics (stats/). A manual run always draws.
      - name: Anything new to draw?
        id: check
        run: |
          fp=$(git ls-tree -r HEAD | grep -vE $'\t(s|og|stats)/' | sha1sum | cut -d' ' -f1)
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$fp" = "$(cat s/.source_fingerprint 2>/dev/null)" ]; then
            echo "draw=no" >> "$GITHUB_OUTPUT"; echo "Nothing changed since the last drawing"
          else
            echo "draw=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.draw == 'yes'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.draw == 'yes'
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Draw every chart and make its share page
        if: steps.check.outputs.draw == 'yes'
        timeout-minutes: 20
        env:
          PAGES: ${{ github.event.inputs.pages }}
        run: |
          python -u scripts/build_chart_cards.py ${PAGES:+--pages "$PAGES"}
          [ -n "$PAGES" ] || echo "${{ steps.check.outputs.fp }}" > s/.source_fingerprint
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add s og/s
          git diff --cached --quiet || (git commit -m "Update chart share links" && git pull --rebase && git push)
