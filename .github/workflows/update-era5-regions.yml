name: Update regional air temperature data (ERA5)

on:
  schedule:
    - cron: "15 * * * *"   # 4x a day while the history is being filled in (concurrency below keeps runs from overlapping);
                                   # once it reaches 1940, once a day ("15 3 * * *") is enough
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:                   # never two runs at once: they would write the same cache
  group: era5-regions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4 ecmwf-datastores-client

      # New days first, then history back towards 1940 for about 4.5 hours; progress is kept between runs.
      - name: Build regional air temperature (Copernicus ERA5)
        continue-on-error: true
        timeout-minutes: 330
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          ERA5_BUDGET_MIN: "305"
          ERA5_PARALLEL: "8"         # history months requested from Copernicus at the same time
        run: |
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDS_API_KEY" > ~/.cdsapirc
          chmod 600 ~/.cdsapirc
          # every 30 minutes, save progress and the open-request list to GitHub (scripts/checkpoint_era5_regions.sh)
          ( while sleep 1800; do bash scripts/checkpoint_era5_regions.sh; done ) &
          CK=$!
          python -u scripts/build_era5_regions.py || rc=$?
          pkill -P $CK 2>/dev/null; kill $CK 2>/dev/null || true
          rm -f ~/.cdsapirc
          exit ${rc:-0}

      # Two runs can overlap (e.g. a manual run next to a scheduled one). A plain "pull --rebase" then hits a
      # conflict on the data files and this run's work - and its list of open Copernicus requests - is lost,
      # so the next run sends those requests again. Instead: keep this run's copies aside, take the latest
      # version from GitHub, and merge both (scripts/merge_era5_regions.py). Retries if someone pushed meanwhile.
      - name: Commit changes
        if: always()
        run: |
          rm -f ~/.cdsapirc data/*.tmp
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/ours
          cp data/era5_t2_regions_daily.csv data/era5_open_requests.json /tmp/ours/ 2>/dev/null || true
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/merge_era5_regions.py /tmp/ours
            git add data
            git diff --cached --quiet && exit 0
            git commit -q -m "Update regional air temperature data"
            git push -q && exit 0
            sleep 20
          done
          exit 1
