name: Update CERES energy imbalance data

on:
  schedule:
    - cron: "30 16 * * *"      # daily check; NASA publishes a new file roughly once a month
  workflow_dispatch:           # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4

      - name: Check for a new CERES file
        id: find
        run: |
          url=$(python scripts/build_ceres.py latest)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "$url" = "$(cat data/ceres_source.txt 2>/dev/null)" ]; then
            echo "new=no" >> "$GITHUB_OUTPUT"; echo "No new file (latest is still $url)"
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"; echo "New file: $url"
          fi

      - name: Download and extract
        if: steps.find.outputs.new == 'yes'
        env:
          EDL_USER: ${{ secrets.EARTHDATA_USERNAME }}
          EDL_PASS: ${{ secrets.EARTHDATA_PASSWORD }}
          URL: ${{ steps.find.outputs.url }}
        run: |
          printf 'machine urs.earthdata.nasa.gov login %s password %s\n' "$EDL_USER" "$EDL_PASS" > ~/.netrc
          chmod 600 ~/.netrc
          curl -fL --retry 3 --netrc -c /tmp/edl_cookies -b /tmp/edl_cookies -o /tmp/ebaf.nc "$URL"
          rm -f ~/.netrc /tmp/edl_cookies
          python scripts/build_ceres.py extract /tmp/ebaf.nc
          echo "$URL" > data/ceres_source.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update CERES data" && git pull --rebase && git push)
