name: Update models data (climate models page)

# The models page uses published archives that change once a year at most (carbon budget each June, WMO outlook each
# May, UNEP each November), so this runs by hand from the Actions tab. scripts/build_models.py downloads the sources,
# checks them (e.g. the IPCC series against Table SPM.1) and writes data/models_*.json/csv.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install netCDF4 openpyxl
      - name: Download, check and build
        run: python -u scripts/build_models.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/models_*
          git add reference/h88 2>/dev/null || true
          git add reference/hansen_temp_check.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update models data" && git pull --rebase && git push)
