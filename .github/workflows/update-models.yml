name: Update models data (climate models page)

# The models page uses published archives that change once a year at most (IGCC each June, WMO outlook each May, UNEP
# each November). Runs monthly and by hand from the Actions tab. If a source changes its format, the checks in the
# script fail and the saved data stays as it is. EDGAR, UNEP and WMO numbers are entered in the script by hand. scripts/build_models.py downloads the sources,
# checks them (e.g. the IPCC series against Table SPM.1) and writes data/models_*.json/csv.
on:
  schedule:
    - cron: "40 5 3 * *"      # monthly (3rd, 05:40 UTC): picks up new IGCC releases (usually June) on its own
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install netCDF4 openpyxl
      - name: Download, check and build
        run: python -u scripts/build_models.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/models_*
          git add reference/h88 2>/dev/null || true
          git add reference/hansen_temp_check.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update models data" && git pull --rebase && git push)
